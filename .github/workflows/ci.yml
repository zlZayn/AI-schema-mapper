# CI —— 只读质检：不写回仓库，不做任何发布动作。
#
# 三条判据的单一来源：
#   - Ruff 版本来自 pyproject.toml 的 [dependency-groups] dev，锁在 uv.lock；
#   - Python 版本来自仓内 .python-version（由 uv 解析）；
#   - 安装统一 `uv sync --frozen`：锁文件与 pyproject 不同步时直接红。
#
# 为什么不跑 pytest：本仓当前没有 tests/ 目录（无任何用例文件），
# 跑 pytest 只会以 exit 5（no tests ran）假红。等有用例后再补这一步。
name: CI

on:
  push:
    branches: ["**"]
  pull_request:

permissions:
  contents: read

jobs:
  quality:
    name: Ruff
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Setup uv
        uses: astral-sh/setup-uv@v5

      - name: Install dependencies (frozen)
        run: uv sync --frozen --group dev

      - name: Ruff check
        run: uv run ruff check .

      - name: Ruff format check
        run: uv run ruff format --check .
